<script>
/* 2026-11-19 smart download link for ads: Android -> Google Play, iPhone/iPad -> App Store, anything else sees both badges */
(function(){
  var PLAY="https://play.google.com/store/apps/details?id=com.supcruise.islandquest",
      IOS="https://apps.apple.com/app/id6822841713",
      ua=navigator.userAgent||"",
      ipad=/Macintosh/.test(ua)&&navigator.maxTouchPoints>1;
  if(/Android/i.test(ua)) location.replace(PLAY);
  else if(/iPhone|iPad|iPod/i.test(ua)||ipad) location.replace(IOS);
})();
</script>
